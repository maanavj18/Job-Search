[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search"
version = "0.1.0"
description = "Local internship finder that drafts Greenhouse, Lever, and Ashby applications for review."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "playwright",
  "python-multipart",
  "pyyaml",
  "rapidfuzz",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
